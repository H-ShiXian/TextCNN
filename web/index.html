<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星火 · 智能错题空间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/web/style.css?v=20260419" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="hero-brand">
        <div class="logo-circle-small">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>
        </div>
        <h1>星火 · 智能错题空间</h1>
      </div>
      <div class="user-profile">
        <div class="avatar">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span id="authStatus" class="username">已登录</span>
        <button id="logoutBtn" class="ghost small-btn" type="button">退出</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="entry" type="button">录入</button>
      <button class="tab" data-tab="list" type="button">记录</button>
      <button class="tab" data-tab="board" type="button">分析</button>
    </nav>

    <section id="tab-entry" class="panel active">
      <h2>录入</h2>
      <textarea id="entryText" placeholder="请输入题目文本..."></textarea>
      <div class="row wrap">
        <input id="ocrImageInput" type="file" accept="image/*" />
        <button id="ocrBtn" class="ghost" type="button">图片识别</button>
      </div>
      
      <div class="btn-group-full">
        <button id="classifyBtn" class="primary btn-large spread-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"></path></svg>
          分类
        </button>
        <button id="saveBtn" class="accent btn-large spread-btn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          确认保存
        </button>
      </div>

      <div class="row">
        <label for="entryAiLabel">类别</label>
        <input id="entryAiLabel" type="text" readonly />
        <label for="entryConfidence">置信度</label>
        <input id="entryConfidence" type="text" readonly />
      </div>
      <div class="row">
        <label for="entryFinalLabel">最终类别</label>
        <select id="entryFinalLabel"></select>
        <button id="parseBtn" class="ghost" type="button">解析</button>
      </div>
      <textarea id="entryAnalysis" placeholder="解析（可选）"></textarea>
      <div id="entryResult" class="result">就绪</div>
    </section>

    <section id="tab-list" class="panel">
      <h2>记录</h2>
      <div class="row wrap">
        <label for="filterLabel">学科</label>
        <select id="filterLabel"><option value="">全部</option></select>
        <label for="filterStatus">状态</label>
        <select id="filterStatus">
          <option value="">全部</option>
            <option value="unreviewed">未复习</option>
            <option value="reviewed">已复习</option>
            <option value="mastered">已掌握</option>
            <option value="careless">粗心错</option>
        </select>
        <label for="filterKeyword">关键词</label>
        <input id="filterKeyword" type="text" placeholder="输入关键词" />
        <button id="searchBtn" class="primary" type="button">查询</button>
      </div>
      <div id="listMeta" class="hint">-</div>
      <table>
        <thead>
          <tr>
            <th>题干</th>
            <th>类别</th>
            <th>状态</th>
            <th>更新时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="questionTbody"></tbody>
      </table>
      <div class="row">
        <button id="prevPageBtn" class="ghost" type="button">上一页</button>
        <button id="nextPageBtn" class="ghost" type="button">下一页</button>
      </div>
    </section>

    <section id="tab-board" class="panel">
      <h2>分析</h2>
      <button id="refreshBoardBtn" class="primary" type="button">刷新</button>
      <div id="boardTotal" class="hint">总题数：0</div>
      <div id="masteryOverview" class="cards"></div>
      <h3>学科分布</h3>
      <div id="boardChart" class="bars"></div>
      <h3>近 7 天趋势</h3>
      <div id="trendChart" class="bars"></div>
      <h3>薄弱学科</h3>
      <div id="weakTopics" class="bars"></div>
    </section>
  </main>
  <script src="/web/app.js?v=20260419"></script>
</body>
</html>
